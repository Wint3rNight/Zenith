<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">EngineSim Frame Loop</title>
  <desc id="desc">Step-by-step frame loop showing which allocator is used at each stage.</desc>
  <defs>
    <style>
      .title { font: 700 28px sans-serif; fill: #1f2937; }
      .step { font: 700 16px sans-serif; fill: #0f172a; }
      .note { font: 500 13px sans-serif; fill: #334155; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 10; ry: 10; }
      .boxLinear { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.6; rx: 10; ry: 10; }
      .boxStack { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.6; rx: 10; ry: 10; }
      .boxPool { fill: #dcfce7; stroke: #15803d; stroke-width: 2.6; rx: 10; ry: 10; }
      .boxFree { fill: #fef3c7; stroke: #b45309; stroke-width: 2.6; rx: 10; ry: 10; }
      .line { stroke: #475569; stroke-width: 2.3; fill: none; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569" />
    </marker>
  </defs>

  <text x="600" y="45" text-anchor="middle" class="title">EngineSim Per-Frame Loop and Allocator Usage</text>

  <rect x="380" y="80" width="440" height="80" class="box" />
  <text x="600" y="112" text-anchor="middle" class="step">1) ResetFrameState</text>
  <text x="600" y="137" text-anchor="middle" class="note">Linear reset + stack reset, clear frame failure counter</text>

  <rect x="380" y="190" width="440" height="80" class="boxPool" />
  <text x="600" y="222" text-anchor="middle" class="step">2) UpdateParticles</text>
  <text x="600" y="247" text-anchor="middle" class="note">Pool allocator: spawn/despawn particle objects</text>

  <rect x="380" y="300" width="440" height="80" class="boxLinear" />
  <text x="600" y="332" text-anchor="middle" class="step">3) BuildFrameScratch</text>
  <text x="600" y="357" text-anchor="middle" class="note">Linear allocator: transient arrays and command payload</text>

  <rect x="380" y="410" width="440" height="80" class="boxStack" />
  <text x="600" y="442" text-anchor="middle" class="step">4) RunSystemScratch</text>
  <text x="600" y="467" text-anchor="middle" class="note">Stack allocator: nested temp buffers, LIFO free</text>

  <rect x="380" y="520" width="440" height="80" class="boxFree" />
  <text x="600" y="552" text-anchor="middle" class="step">5) AgeAndCollectResourceBlobs</text>
  <text x="600" y="577" text-anchor="middle" class="note">Free-list allocator: free expired mixed-size blobs</text>

  <rect x="380" y="630" width="440" height="80" class="boxFree" />
  <text x="600" y="662" text-anchor="middle" class="step">6) CreateResourceBlobs</text>
  <text x="600" y="687" text-anchor="middle" class="note">Free-list allocator: allocate new mixed-size blobs</text>

  <rect x="380" y="740" width="440" height="80" class="box" />
  <text x="600" y="772" text-anchor="middle" class="step">7) CaptureSnapshot + UpdateSummary + WriteCsvRow</text>
  <text x="600" y="797" text-anchor="middle" class="note">Record per-frame metrics and aggregate burst/steady stats</text>

  <rect x="380" y="850" width="440" height="80" class="box" />
  <text x="600" y="882" text-anchor="middle" class="step">8) Optional PrintFrameReport</text>
  <text x="600" y="907" text-anchor="middle" class="note">Print row when frame matches report interval</text>

  <line x1="600" y1="160" x2="600" y2="190" class="line" />
  <line x1="600" y1="270" x2="600" y2="300" class="line" />
  <line x1="600" y1="380" x2="600" y2="410" class="line" />
  <line x1="600" y1="490" x2="600" y2="520" class="line" />
  <line x1="600" y1="600" x2="600" y2="630" class="line" />
  <line x1="600" y1="710" x2="600" y2="740" class="line" />
  <line x1="600" y1="820" x2="600" y2="850" class="line" />
</svg>
